name: Reportar un problema
description: Informar errores visuales o de funcionamiento de midnight-cloud.
title: "[Error]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Qué sucede
      description: Descripción del problema y del lugar donde aparece.
      placeholder: Describir el comportamiento observado, dónde ocurre y cuándo aparece.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Componente afectado
      multiple: true
      options:
        - Colores e iconos
        - Lista de servidores o canales
        - Chat y mensajes
        - Barra de escritura
        - Barra superior y controles de ventana
        - Panel de usuario o perfiles
        - Ajustes, menús o ventanas emergentes
        - Llamadas y pantalla compartida
        - Addons
        - Construcción o prueba local
        - Otro / no identificado
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
      placeholder: Describir el aspecto o comportamiento esperado.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir...
        2. Seleccionar...
        3. El problema aparece cuando...
    validations:
      required: true

  - type: dropdown
    id: discord-channel
    attributes:
      label: Canal de Discord
      options:
        - Stable
        - PTB
        - Canary
        - No identificado
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Entorno y versiones
      description: Incluir las versiones disponibles y si se utiliza el tema publicado o el test local.
      placeholder: |
        Sistema operativo:
        Versión o número de compilación de Discord:
        Versión de BetterDiscord u otro cliente modificado:
        Versión de midnight-cloud:
        Tema publicado o test local:
    validations:
      required: true

  - type: input
    id: element-class
    attributes:
      label: Clase del elemento afectado
      description: Desde el inspector de Discord, seleccionar el elemento y copiar su atributo class completo, incluido el hash. Campo opcional si no se puede identificar.
      placeholder: Clases copiadas del atributo class del elemento.

  - type: textarea
    id: inspected-css
    attributes:
      label: CSS o variables del inspector
      description: Información relevante del inspector, como reglas CSS, propiedades, variables o valores calculados relacionados con el problema. Campo opcional.
      placeholder: |
        /* Reglas CSS o valores relevantes del inspector. */
      render: css

  - type: upload
    id: attachments
    attributes:
      label: Capturas y archivos adjuntos
      description: Adjuntar capturas del problema, del inspector o archivos CSS y registros que ayuden a reproducirlo.
    validations:
      required: false

  - type: textarea
    id: customizations
    attributes:
      label: Addons, plugins y CSS adicional
      description: Indicar los complementos activos y si el problema también aparece al desactivar otros temas, plugins o reglas personalizadas.
      placeholder: |
        Addons activos:
        Plugins relacionados:
        Cambios de CSS relevantes:
        Resultado sin otras personalizaciones: